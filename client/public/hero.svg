<g fill="#16202e"><text x="52" y="76">function summarize(tasks) {</text><text x="52" y="106">  const open = tasks.filter(t =&gt; !t.done);</text><text x="52" y="136">  const late = open.filter(isOverdue);</text><text x="52" y="166">  return { open: open.length, late: late.length };</text><text x="52" y="196">}</text><text x="52" y="226">export default summarize;</text></g>
